<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>gthez-sosyal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}

/* ===== BACKGROUND : AURORA WAVES ===== */
body{
  margin:0;
  min-height:100vh;
  background:#020617;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

.bg{
  position:fixed;
  inset:-20%;
  z-index:-1;
  background:
    radial-gradient(60% 40% at 20% 30%, rgba(88,101,242,.18), transparent 60%),
    radial-gradient(50% 40% at 80% 20%, rgba(37,99,235,.14), transparent 60%),
    radial-gradient(60% 50% at 50% 80%, rgba(254,44,85,.12), transparent 60%);
  filter: blur(60px);
  animation: aurora 18s ease-in-out infinite alternate;
}

@keyframes aurora{
  from{transform:translateY(-40px)}
  to{transform:translateY(40px)}
}

/* ===== CONTENT ===== */
.wrap{
  width:100%;
  max-width:380px;
  padding:24px;
  text-align:center;
}

/* PROFILE */
.profile{
  position:relative;
  width:120px;
  height:120px;
  margin:0 auto 18px;
  border-radius:50%;
  padding:3px;
  background:linear-gradient(135deg,#5865F2,#404EED);
  animation: profilePulse 4s ease-in-out infinite;
}

.profile img{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  background:#020617;
}

.profile::after{
  content:"";
  position:absolute;
  inset:-12px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(88,101,242,.45),transparent 70%);
  filter:blur(22px);
  z-index:-1;
}

@keyframes profilePulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.05)}
}

h1{
  margin:14px 0 36px;
  font-size:24px;
  letter-spacing:2px;
  text-transform:lowercase;
}

/* ===== LINKS BASE ===== */
.link{
  position:relative;
  display:flex;
  align-items:center;
  gap:14px;
  padding:16px 20px;
  margin-bottom:22px;
  border-radius:16px;
  text-decoration:none;
  color:#fff;
  font-weight:600;
  overflow:hidden;
  transition:transform .25s ease, box-shadow .25s ease;
}

.link:hover{
  transform:scale(1.05);
}

.icon{
  width:28px;
  height:28px;
  z-index:2;
}

.label{
  z-index:2;
  font-size:17px;
  letter-spacing:.5px;
}

/* ===== LIGHT SWEEP (SMOOTH) ===== */
.link::before{
  content:"";
  position:absolute;
  inset:0;
  left:-120%;
  width:120%;
  transform:skewX(-20deg);
  opacity:.25;
}

.link:hover::before{
  left:120%;
  transition:1s ease;
}

/* ===== DISCORD ===== */
.discord{
  background:linear-gradient(135deg,#5865F2,#404EED);
  box-shadow:0 0 18px rgba(88,101,242,.45);
}

.discord::before{
  background:linear-gradient(
    90deg,
    transparent,
    rgba(88,101,242,.9),
    transparent
  );
}

.discord:hover{
  box-shadow:0 0 30px rgba(88,101,242,.7);
}

/* ===== TIKTOK ===== */
.tiktok{
  background:linear-gradient(
    135deg,
    #25F4EE,
    #000000,
    #FE2C55
  );
  box-shadow:0 0 18px rgba(254,44,85,.45);
}

.tiktok::before{
  background:linear-gradient(
    90deg,
    transparent,
    rgba(37,244,238,.9),
    rgba(254,44,85,.9),
    transparent
  );
}

.tiktok:hover{
  box-shadow:0 0 30px rgba(254,44,85,.65);
}

.footer{
  margin-top:36px;
  font-size:12px;
  opacity:.5;
  letter-spacing:1px;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="wrap">

  <div class="profile">
    <img src="profile.png" alt="gthez">
  </div>

  <h1>gthez</h1>

  <a class="link discord" href="https://discord.gg/T3XJdxxC6u" target="_blank">
    <img class="icon" src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/discord.svg">
    <span class="label">Discord</span>
  </a>

  <a class="link tiktok" href="https://tiktok.com/@gthezz" target="_blank">
    <img class="icon" src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/tiktok.svg">
    <span class="label">TikTok</span>
  </a>

  <div class="footer">-GTheZ-</div>
<div class="footer">--</div>
</div>

</body>
</html>
